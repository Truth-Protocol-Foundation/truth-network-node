name: Cargo build

on:
  workflow_call:
    inputs:
      upload_artifacts:
        required: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.81.0
          rustup override set 1.81.0

      - name: Restore cargo cache - common
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Set up cargo cache - build
        uses: actions/cache@v4
        continue-on-error: false
        with:
          path: |
            target/
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --locked --release

      - name: Node Artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: node
          path: target/release/tnf-node
          if-no-files-found: error

      - name: Node runtime Artifact
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: node-runtime
          path: target/release/wbuild/tnf-node-runtime/tnf_node_runtime.compact.compressed.wasm
          if-no-files-found: error

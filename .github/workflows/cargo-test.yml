name: Cargo Test

on:
  workflow_call:
    inputs:
      fetch-depth:
        required: false
        type: number
        default: 1
      ref:
        required: false
        type: string
        default: ''
      repository:
        required: false
        type: string
        default: ''

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Rust
        run: |
          rustup toolchain install nightly-2024-04-15 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default nightly-2024-04-15
          rustup override set nightly-2024-04-15

      - name: Restore cargo cache - common
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Linting check
        run: cargo +nightly-2024-04-15 fmt --all --check

  test:
    name: Test Code
    runs-on: ubuntu-24.04    
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.81.0
          rustup override set 1.81.0

      - name: Restore cargo cache - common
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - test
        uses: actions/cache@v4
        with:
          path: |
            target/
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}      

      - name: Test Code
        run: cargo test

  runtime-benchmarks:
    name: Runtime Benchmarks
    runs-on: ubuntu-24.04    
    needs: ci
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.ref }}
          repository: ${{ inputs.repository }}

      - name: Install Protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler

      - name: Install Rust
        run: |
          rustup toolchain install 1.81.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.81.0
          rustup override set 1.81.0

      - name: Restore cargo cache - common
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-common-${{ hashFiles('**/Cargo.lock') }}

      - name: Restore cargo cache - runtime benchmarks
        uses: actions/cache@v4
        with:
          path: |
            target/
          key: ${{ runner.os }}-runtime-benchmarks-${{ hashFiles('**/Cargo.lock') }}      

      - name: Runtime Benchmarks
        run: cargo test  --features runtime-benchmarks -- benchmarks
